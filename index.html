<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>זהות · הפרויקטים שלי</title>
<!-- Design system: OpenDesign / nike (option 3), dark-adapted: inverted grey-900/800/700 surfaces,
     Orange Flash #FF5000 (Podium orange-400) as the single hot accent.
     Futura ND → Karantina 700 (display only, ≥24px). Helvetica Now → Heebo 400/500 (500 for everything interactive). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#111111; --deep:#1F1F21; --dark:#28282A; --dark-hover:#39393B;
    --white:#FFFFFF; --grey-300:#CACACB; --grey-400:#9E9EA0; --grey-500:#707072; --dis-inv:#4B4B4D;
    --orange:#FF5000; --red:#EE0005; --success-inv:#1EAA52; --focus:rgba(39,93,197,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--black)}
  body{font-family:"Heebo",Helvetica,Arial,sans-serif;color:var(--white);max-width:480px;margin:0 auto;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  button,input,textarea{font-family:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:none;box-shadow:0 0 0 2px var(--focus)}
  .display{font-family:"Karantina",Impact,sans-serif;font-weight:700}

  /* promo banner */
  .promo{background:var(--black);font-size:12px;font-weight:500;text-align:center;padding:10px 16px;border-bottom:1px solid var(--dark)}
  .promo b{color:var(--orange);font-weight:500}

  /* nav */
  .nav{display:flex;justify-content:space-between;align-items:center;height:60px;padding:0 16px}
  .logo{font-size:34px;line-height:1}
  .icon-btn{width:44px;height:44px;border-radius:50%;background:var(--dark);border:0;display:grid;place-items:center;font-size:22px;font-weight:500;color:var(--white)}
  .icon-btn:active{background:var(--dark-hover)}

  /* hero */
  .hero{padding:24px 16px 32px}
  .eyebrow{font-size:14px;font-weight:500;color:var(--grey-400)}
  .hero h1{font-size:112px;line-height:.9;margin:8px 0 4px;letter-spacing:-1px}
  .hero h1 span{color:var(--orange)}
  .hero p{font-size:16px;line-height:1.75;color:var(--grey-300)}
  .chips{display:flex;gap:8px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1.5px solid var(--dis-inv);background:transparent;border-radius:30px;padding:0 16px;min-height:40px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s ease,border-color .2s ease}
  .chip.on{background:var(--white);color:var(--black);border-color:var(--white)}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 16px}
  .stat{background:var(--deep);padding:16px 12px;border:0;text-align:right;color:var(--white)}
  .stat strong{font-size:48px;line-height:.9;display:block}
  .stat span{font-size:12px;font-weight:500;color:var(--grey-400)}

  .h1{font-size:32px;font-weight:500;line-height:1.2;padding:48px 16px 16px;display:flex;justify-content:space-between;align-items:baseline}
  .h1 small{font-size:14px;color:var(--grey-400);font-weight:500}

  /* cards */
  .cards{display:flex;flex-direction:column;gap:12px;padding:0 16px}
  .card{background:var(--deep);border-radius:20px;padding:20px;border:0;text-align:right;width:100%;color:var(--white);display:block}
  .row{display:flex;justify-content:space-between;align-items:center}
  .badge{font-size:12px;font-weight:500;border-radius:30px;padding:4px 12px;background:var(--dark);color:var(--grey-300)}
  .badge.active{background:var(--orange);color:var(--black)}
  .badge.done{color:var(--success-inv)}
  .date{font-size:12px;font-weight:500;color:var(--grey-400)}
  .date.soon{color:var(--orange)}
  .date.late{color:var(--red)}
  .card h3{font-size:24px;font-weight:500;line-height:1.2;margin:16px 0 4px}
  .desc{font-size:14px;line-height:1.5;color:var(--grey-400)}
  .prog{display:flex;align-items:flex-end;gap:12px;margin:20px 0 16px}
  .pct{font-size:64px;line-height:.8;min-width:2ch}
  .bar{flex:1;height:8px;border-radius:30px;background:var(--dark);overflow:hidden;margin-bottom:6px}
  .bar i{display:block;height:100%;border-radius:30px;background:var(--white);transition:width .4s ease}
  .card.active .bar i{background:var(--orange)}
  .next{background:var(--dark);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .next .k{font-size:12px;font-weight:500;color:var(--grey-400);display:block}
  .next .v{font-size:16px;font-weight:500;line-height:1.5}
  .arrow{width:36px;height:36px;border-radius:50%;background:var(--white);color:var(--black);display:grid;place-items:center;font-size:18px;flex:none}
  .card.done h3,.card.done .pct{color:var(--grey-400)}
  .empty{background:var(--deep);border-radius:20px;padding:32px 20px;text-align:center;color:var(--grey-400);font-size:16px;font-weight:500}

  /* timeline */
  .tl{display:none;padding:0 16px}
  .tl.show{display:block}
  .tl-item{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:16px 0;box-shadow:0 -1px 0 0 var(--dark) inset}
  .tl-date{font-size:36px;line-height:.9}
  .tl-date small{display:block;font-family:"Heebo";font-size:12px;font-weight:500;color:var(--grey-400);margin-top:4px}
  .tl-t{font-size:16px;font-weight:500}
  .tl-n{font-size:14px;color:var(--grey-400);line-height:1.5}

  .actions{display:flex;gap:8px;padding:32px 16px 48px}
  .btn{flex:1;border-radius:30px;min-height:48px;padding:12px 24px;font-size:16px;font-weight:500;border:0;transition:background .2s ease}
  .btn-primary{background:var(--white);color:var(--black)}
  .btn-primary:active{background:var(--grey-300)}
  .btn-secondary{background:transparent;color:var(--white);border:1.5px solid var(--dis-inv)}
  .btn-secondary:active{border-color:var(--grey-500)}
  .btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--dis-inv);flex:0 0 auto}

  /* editor sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:10}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--deep);border-radius:20px 20px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));
         transform:translateY(105%);transition:transform .25s ease;z-index:11;max-height:92vh;overflow-y:auto}
  .sheet.show{transform:none}
  .grab{width:40px;height:4px;border-radius:30px;background:var(--dis-inv);margin:0 auto 16px}
  .sheet h2{font-size:48px;line-height:.9;margin-bottom:16px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--grey-400);margin-bottom:6px}
  .input{width:100%;background:var(--dark);border:1px solid var(--dark);border-radius:8px;padding:12px;font-size:16px;line-height:1.5;transition:border-color .2s ease}
  .input:focus{border-color:var(--white);outline:none}
  textarea.input{resize:none;min-height:72px}
  .seg{display:flex;gap:8px}
  .seg .chip{flex:1}
  .range-row{display:flex;align-items:center;gap:16px}
  .range-row .pct{font-size:48px;min-width:3.2ch;text-align:left}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:30px;background:var(--dark);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--white);border:0}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--white);border:0}
  .sheet .actions{padding:8px 0 0}
  .toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:var(--white);color:var(--black);border-radius:30px;padding:10px 20px;font-size:14px;font-weight:500;transition:transform .25s ease;z-index:20}
  .toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
  <div class="promo" id="promo">עוד <b>…</b> לבחירות · 27.10</div>
  <nav class="nav"><span class="logo display">זהות</span><button class="icon-btn" id="addTop" aria-label="פרויקט חדש">+</button></nav>

  <header class="hero">
    <div class="eyebrow">חדר המבצעים שלי</div>
    <h1 class="display">לא עוצרים<span>.</span></h1>
    <p id="tagline">פרויקטים. מסלול אחד. עד הקו.</p>
    <div class="chips" id="filters">
      <button class="chip on" data-f="all">הכול</button>
      <button class="chip" data-f="active">פעיל</button>
      <button class="chip" data-f="waiting">ממתין</button>
      <button class="chip" data-f="done">הושלם</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <h2 class="h1"><span id="listTitle">הפרויקטים</span><small id="listCount"></small></h2>
  <main class="cards" id="cards"></main>
  <section class="tl" id="timeline"></section>

  <div class="actions">
    <button class="btn btn-primary" id="addBottom">פרויקט חדש</button>
    <button class="btn btn-secondary" id="toggleView">לו״ז מלא</button>
  </div>

  <div class="scrim" id="scrim"></div>
  <form class="sheet" id="sheet" autocomplete="off">
    <div class="grab"></div>
    <h2 class="display" id="sheetTitle">עריכה</h2>
    <div class="field"><label for="fTitle">שם הפרויקט</label><input class="input" id="fTitle" required maxlength="60"></div>
    <div class="field"><label for="fDesc">פרטים (שורה אחת)</label><input class="input" id="fDesc" maxlength="90"></div>
    <div class="field"><label>סטטוס</label>
      <div class="seg" id="fStatus">
        <button type="button" class="chip" data-s="active">פעיל</button>
        <button type="button" class="chip" data-s="waiting">ממתין</button>
        <button type="button" class="chip" data-s="done">הושלם</button>
      </div></div>
    <div class="field"><label for="fProg">התקדמות</label>
      <div class="range-row"><span class="pct display" id="fProgOut">0%</span><input type="range" id="fProg" min="0" max="100" step="1" dir="rtl"></div></div>
    <div class="field"><label for="fNext">הצעד הבא</label><textarea class="input" id="fNext" maxlength="120"></textarea></div>
    <div class="field"><label for="fDue">דדליין</label><input class="input" id="fDue" type="date"></div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">שמירה</button>
      <button type="button" class="btn btn-secondary" id="cancel">ביטול</button>
      <button type="button" class="btn btn-danger" id="del">מחיקה</button>
    </div>
  </form>
  <div class="toast" id="toast"></div>

<script>
const KEY = 'zehut-dashboard-v1';
const ELECTION = new Date('2026-10-27T07:00:00+02:00');
const STATUS = {active:'פעיל', waiting:'ממתין', done:'הושלם'};
const SAMPLE = [
  {id:'p1', title:'שיחות טלפון של מתנדבים', desc:'53 משובצים · יעד 30 שיחות ביום', status:'active', progress:62, next:'להפעיל 12 מתנדבים שלא התחילו', due:'2026-10-22'},
  {id:'p2', title:'דיוור SMS ומייל לנרשמים', desc:'כ־700 נרשמים · 410 נשלחו', status:'active', progress:59, next:'גל שני — תזכורת למי שלא פתח', due:'2026-10-20'},
  {id:'p3', title:'שיבוץ מתנדבים — תפקידים ועדיפויות', desc:'מחכה לרשימת העדיפויות מהמטה', status:'waiting', progress:35, next:'לקבל רשימה ולשבץ', due:'2026-10-23'},
  {id:'p4', title:'תיאום עם המטה', desc:'שיחת סטטוס שבועית · 3 נושאים פתוחים', status:'active', progress:45, next:'לסגור לו״ז ליום הבחירות', due:'2026-10-21'},
  {id:'p5', title:'דף מעקב תשובות', desc:'כן 212 · לא 64 · לא ענו 134', status:'done', progress:100, next:'לייצא דוח יומי', due:'2026-10-17'},
];
const $ = s => document.querySelector(s);
let projects = load(), filter = 'all', view = 'cards', editing = null, formStatus = 'active';

function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(d)) return d; }catch(e){} return SAMPLE.map(p=>({...p})); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(projects)); }catch(e){ toast('לא הצלחתי לשמור במכשיר'); } }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function daysLeft(due){ if(!due) return null; return Math.round((startOfDay(due+'T00:00') - startOfDay(new Date()))/864e5); }
function fmt(due){ if(!due) return ''; const [y,m,d]=due.split('-'); return `${+d}.${+m}`; }
function dueLabel(p){
  if(!p.due) return {t:'בלי דדליין', c:''};
  if(p.status==='done') return {t:fmt(p.due), c:''};
  const n = daysLeft(p.due);
  if(n<0) return {t:`באיחור · ${fmt(p.due)}`, c:'late'};
  if(n===0) return {t:'היום!', c:'soon'};
  if(n<=2) return {t:`עוד ${n===1?'יום':'יומיים'} · ${fmt(p.due)}`, c:'soon'};
  return {t:`עד ${fmt(p.due)}`, c:''};
}
function order(list){ const r={active:0,waiting:1,done:2}; return [...list].sort((a,b)=> r[a.status]-r[b.status] || (a.due||'9').localeCompare(b.due||'9')); }

function renderCountdown(){
  const ms = ELECTION - new Date();
  const d = Math.ceil(ms/864e5);
  $('#promo').innerHTML = ms<=0 ? '<b>יום הבחירות</b> · 27.10' : `עוד <b>${d===1?'יום אחד':d+' ימים'}</b> לבחירות · 27.10`;
}

function render(){
  renderCountdown();
  const c = {active:0, waiting:0, done:0}; projects.forEach(p=>c[p.status]++);
  $('#stats').innerHTML = ['active','waiting','done'].map(s=>
    `<button class="stat" data-f="${s}"><strong class="display">${c[s]}</strong><span>${s==='active'?'פעילים':STATUS[s]}</span></button>`).join('');
  $('#tagline').textContent = `${projects.length} פרויקטים. מסלול אחד. עד הקו.`;
  document.querySelectorAll('#filters .chip').forEach(b=>b.classList.toggle('on', b.dataset.f===filter));
  const list = order(projects.filter(p=>filter==='all'||p.status===filter));
  $('#listTitle').textContent = view==='cards' ? 'הפרויקטים' : 'לו״ז';
  $('#listCount').textContent = list.length ? `${list.length}` : '';
  $('#cards').style.display = view==='cards' ? '' : 'none';
  $('#timeline').classList.toggle('show', view==='timeline');
  $('#toggleView').textContent = view==='cards' ? 'לו״ז מלא' : 'כרטיסים';

  $('#cards').innerHTML = list.length ? list.map(p=>{
    const d = dueLabel(p), pr = Math.max(0,Math.min(100,+p.progress||0));
    return `<button class="card ${p.status}" data-id="${esc(p.id)}">
      <div class="row"><span class="badge ${p.status}">${STATUS[p.status]}${p.status==='done'?' ✓':''}</span><span class="date ${d.c}">${esc(d.t)}</span></div>
      <h3>${esc(p.title)}</h3>
      ${p.desc?`<p class="desc">${esc(p.desc)}</p>`:''}
      <div class="prog"><span class="pct display">${pr}%</span><div class="bar"><i style="width:${pr}%"></i></div></div>
      <div class="next"><div><span class="k">הצעד הבא</span><span class="v">${esc(p.next||'—')}</span></div><span class="arrow">←</span></div>
    </button>`}).join('') : `<div class="empty">אין כאן פרויקטים</div>`;

  const tl = [...list].sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  $('#timeline').innerHTML = tl.length ? tl.map(p=>{
    const d = dueLabel(p);
    return `<div class="tl-item"><div class="tl-date display">${p.due?fmt(p.due):'—'}<small class="${d.c?'date '+d.c:''}">${STATUS[p.status]}</small></div>
      <div><div class="tl-t">${esc(p.title)}</div><div class="tl-n">${esc(p.next||'')}</div></div></div>`}).join('') : `<div class="empty">אין כאן פרויקטים</div>`;
}

function setFormStatus(s){ formStatus=s; document.querySelectorAll('#fStatus .chip').forEach(b=>b.classList.toggle('on', b.dataset.s===s)); }
function openSheet(p){
  editing = p ? p.id : null;
  $('#sheetTitle').textContent = p ? 'עריכה' : 'פרויקט חדש';
  $('#fTitle').value = p?.title||''; $('#fDesc').value = p?.desc||''; $('#fNext').value = p?.next||'';
  $('#fDue').value = p?.due||''; $('#fProg').value = p?.progress??0; $('#fProgOut').textContent = ($('#fProg').value)+'%';
  setFormStatus(p?.status||'active');
  $('#del').style.display = p ? '' : 'none';
  $('#scrim').classList.add('show'); $('#sheet').classList.add('show');
  $('#sheet').scrollTop = 0;
}
function closeSheet(){ $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); editing=null; }
let tt; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1800); }

document.addEventListener('click', e=>{
  const f = e.target.closest('[data-f]'); if(f){ filter = (filter===f.dataset.f && f.classList.contains('stat')) ? 'all' : f.dataset.f; render(); return; }
  const card = e.target.closest('.card'); if(card){ openSheet(projects.find(p=>p.id===card.dataset.id)); return; }
  const s = e.target.closest('#fStatus .chip'); if(s){ setFormStatus(s.dataset.s); if(s.dataset.s==='done'){ $('#fProg').value=100; $('#fProgOut').textContent='100%'; } }
});
$('#addTop').onclick = $('#addBottom').onclick = ()=>openSheet(null);
$('#toggleView').onclick = ()=>{ view = view==='cards'?'timeline':'cards'; render(); };
$('#scrim').onclick = $('#cancel').onclick = closeSheet;
$('#fProg').oninput = e=>{ $('#fProgOut').textContent = e.target.value+'%'; };
$('#del').onclick = ()=>{
  const p = projects.find(x=>x.id===editing); if(!p) return;
  if(!confirm(`למחוק את "${p.title}"?`)) return;
  projects = projects.filter(x=>x.id!==editing); save(); closeSheet(); render(); toast('נמחק');
};
$('#sheet').onsubmit = e=>{
  e.preventDefault();
  const title = $('#fTitle').value.trim(); if(!title){ $('#fTitle').focus(); return; }
  const data = {title, desc:$('#fDesc').value.trim(), status:formStatus, progress:+$('#fProg').value, next:$('#fNext').value.trim(), due:$('#fDue').value};
  if(editing){ Object.assign(projects.find(p=>p.id===editing), data); toast('נשמר'); }
  else { projects.push({id:'p'+Date.now().toString(36), ...data}); toast('נוסף פרויקט'); }
  save(); closeSheet(); render();
};
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
setInterval(renderCountdown, 60000);
render();
</script>
</body>
</html>
